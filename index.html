<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Generator Pro</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
    }
    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn { 
      from { opacity: 0; transform: scale(0.95) translateY(10px); } 
      to { opacity: 1; transform: scale(1) translateY(0); } 
    }
    .focus-ring { box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-8">
  <main class="w-full max-w-3xl bg-white/90 backdrop-blur-xl rounded-[2rem] shadow-2xl overflow-hidden p-6 sm:p-12 transition-all border border-gray-100">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center p-3 bg-blue-50 rounded-2xl mb-4">
        <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
        </svg>
      </div>
      <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 tracking-tight mb-3">QR Generator</h1>
      <p class="text-lg sm:text-xl text-gray-500 font-medium">Type your link below. Watch the magic happen.</p>
    </div>
    
    <div class="relative mb-12 group">
      <input 
        type="text" 
        id="qr-input" 
        placeholder="https://example.com" 
        class="w-full text-2xl sm:text-3xl p-6 sm:p-8 bg-gray-50 border-2 border-transparent rounded-3xl focus:outline-none focus:border-blue-500 focus:bg-white focus-ring transition-all placeholder-gray-400 text-gray-800 shadow-inner block"
        autocomplete="off"
        spellcheck="false"
      >
      <div class="absolute right-6 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-blue-500 transition-colors">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
      </div>
    </div>

    <div class="flex flex-col justify-center items-center min-h-[340px]">
      <div id="qr-container" class="hidden fade-in flex flex-col items-center gap-8">
        <div class="bg-white p-4 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-gray-100 ring-1 ring-black/5">
          <canvas id="qr-canvas" class="rounded-xl"></canvas>
        </div>
        <button id="download-btn" class="px-8 py-4 bg-gray-900 hover:bg-black text-white text-lg sm:text-xl font-semibold rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-0.5 transition-all flex items-center gap-3 active:scale-95">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download QR
        </button>
      </div>
      
      <div id="empty-state" class="text-gray-400 text-center flex flex-col items-center px-4">
        <div class="w-24 h-24 mb-6 rounded-full bg-gray-50 flex items-center justify-center border-2 border-dashed border-gray-200">
          <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 4a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 4a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V4z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H4a1 1 0 01-1-1v-4z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 16a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
          </svg>
        </div>
        <p class="text-xl sm:text-2xl font-medium text-gray-500">Awaiting input...</p>
        <p class="text-base sm:text-lg text-gray-400 mt-2 max-w-xs">Start typing a URL or some text in the box above.</p>
      </div>
    </div>
    
  </main>

  <!-- PWA Install prompt toast -->
  <div id="pwa-toast" class="hidden fixed bottom-4 right-4 bg-gray-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 fade-in z-50">
    <div>
      <p class="font-semibold text-sm sm:text-base">Install App</p>
      <p class="text-xs sm:text-sm text-gray-400">Get it on your home screen</p>
    </div>
    <button id="pwa-install-btn" class="ml-4 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-sm font-semibold rounded-xl transition-colors">Install</button>
    <button id="pwa-close-btn" class="text-gray-400 hover:text-white transition-colors p-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const input = document.getElementById('qr-input');
    const qrContainer = document.getElementById('qr-container');
    const qrCanvas = document.getElementById('qr-canvas');
    const emptyState = document.getElementById('empty-state');
    const downloadBtn = document.getElementById('download-btn');

    let debounceTimer;

    function generateQR(text) {
      if (!text.trim()) {
        qrContainer.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }
      
      QRCode.toCanvas(qrCanvas, text, {
        width: 320,
        margin: 2,
        scale: 10,
        color: {
          dark: '#111827',
          light: '#ffffff'
        }
      }, function (error) {
        if (error) console.error(error);
        emptyState.classList.add('hidden');
        qrContainer.classList.remove('hidden');
      });
    }

    input.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        generateQR(e.target.value);
      }, 100); 
    });

    // Auto focus on desktop
    if(window.innerWidth > 768) {
      input.focus();
    }

    downloadBtn.addEventListener('click', () => {
        const url = qrCanvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = 'qrcode.png';
        link.href = url;
        link.click();
    });

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW setup failed', err));
      });
    }

    // PWA Install Logic
    let deferredPrompt;
    const pwaToast = document.getElementById('pwa-toast');
    const installBtn = document.getElementById('pwa-install-btn');
    const closeBtn = document.getElementById('pwa-close-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaToast.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          pwaToast.classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    closeBtn.addEventListener('click', () => {
      pwaToast.classList.add('hidden');
    });
  </script>
</body>
</html>
