<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>QR Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    
    /* Loading spinner animation */
    .loader {
      border: 3px solid #f3f3f3;
      border-radius: 50%;
      border-top: 3px solid #4f46e5;
      width: 24px;
      height: 24px;
      -webkit-animation: spin 1s linear infinite; /* Safari */
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 p-6 sm:p-10 max-w-md w-full space-y-8 border border-slate-100">
    
    <!-- Header -->
    <div class="text-center">
      <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-indigo-600/30">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">QR Studio</h1>
      <p class="text-slate-500 font-medium mt-2">100% Reliable Cloud QR Generator</p>
    </div>

    <!-- Input Box -->
    <div class="space-y-3">
      <label class="block text-sm font-bold text-slate-700 uppercase tracking-widest pl-1">Target URL or Text</label>
      <input type="text" id="qr-input" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-6 py-4 text-lg font-semibold text-slate-800 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all placeholder-slate-400" placeholder="https://example.com" value="https://example.com" autocomplete="off">
    </div>

    <!-- QR Code Image and Download -->
    <div class="flex flex-col items-center gap-6">
      
      <!-- The Real PNG Image Container -->
      <div class="bg-white p-4 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-100 flex flex-col items-center justify-center w-full max-w-[280px] aspect-square relative">
        
        <!-- Loading State -->
        <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center bg-white/90 z-10 rounded-3xl hidden">
          <div class="loader mb-2"></div>
          <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Generating...</p>
        </div>

        <!-- We use a REAL server-generated <img> tag here so it never fails on mobile -->
        <img id="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://example.com&margin=10" alt="QR Code" class="w-full h-full object-contain rounded-xl transition-all duration-300" crossorigin="anonymous">
      </div>
      
      <p class="text-sm text-slate-400 font-medium text-center">💡 <span class="text-slate-500">Mobile tip:</span> You can also long-press the image above to save it directly to your phone's gallery.</p>
      
      <!-- Download Button -->
      <button id="download-btn" class="w-full bg-slate-900 hover:bg-black active:scale-[0.98] text-white font-bold py-5 px-6 rounded-2xl transition-all flex items-center justify-center gap-3 shadow-xl hover:shadow-2xl text-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        Download PNG
      </button>

    </div>
  </div>

  <script>
    const input = document.getElementById('qr-input');
    const img = document.getElementById('qr-image');
    const downloadBtn = document.getElementById('download-btn');
    const loading = document.getElementById('loading');

    let typingTimer;

    function updateQR() {
      const text = input.value || "https://example.com";
      // URL encode the text so the API can read it properly
      const encodedText = encodeURIComponent(text);
      
      // Use the extremely reliable Cloud API which works 100% of the time on all devices
      const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=${encodedText}&margin=10`;
      
      loading.classList.remove('hidden');
      
      // Update image source
      img.src = apiUrl;
    }

    // Hide loader when image successfully loads from the cloud
    img.onload = () => {
      loading.classList.add('hidden');
    };

    // Debounce typing so we don't spam the API server on every single letter
    input.addEventListener('input', () => {
      clearTimeout(typingTimer);
      typingTimer = setTimeout(updateQR, 500); // Wait 0.5s after user stops typing
    });

    // Foolproof Download action
    downloadBtn.addEventListener('click', async () => {
      try {
        const response = await fetch(img.src);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.download = 'Professional_QR_Code.png';
        link.href = blobUrl;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        // Fallback for strict browsers
        const link = document.createElement('a');
        link.download = 'Professional_QR_Code.png';
        link.href = img.src;
        link.target = "_blank";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    });
  </script>
</body>
</html>
